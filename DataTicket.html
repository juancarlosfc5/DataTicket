function markDirty() { builderDraft(builder.co).dirty = true; renderBHead(); }
function selectField(kind, key) { builder.selected = { kind, key }; renderCanvas(); renderProps(); }
function refocusCard(key) { const c = $(`.fcard[data-key="${CSS.escape(key)}"]`); if (c) c.focus(); }

function addField(spec, index) {
  const d = builderDraft(builder.co);
  const f = { key: '', label: spec.label, type: spec.type, required: !!spec.required, help: spec.help || '', options: spec.options && spec.options.length ? [...spec.options] : hasOptions(spec.type) ? ['Opción 1', 'Opción 2'] : [], v: spec.v ? { ...spec.v } : {}, isNew: true };
  f.key = uniqueKey(spec.key || slug(spec.label), f);
  d.fields.splice(index === undefined ? d.fields.length : index, 0, f);
  builder.selected = { kind: 'custom', key: f.key };
  markDirty(); renderCatalog(); renderCanvas(); renderProps();
  const card = $(`.fcard[data-key="${CSS.escape(f.key)}"]`);
  if (card) card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });

function moveField(key, dir, keepFocus) {
  const d = builderDraft(builder.co); const i = d.fields.findIndex((f) => f.key === key); const j = i + dir;
  if (i < 0 || j < 0 || j >= d.fields.length) return;
  const [f] = d.fields.splice(i, 1); d.fields.splice(j, 0, f);
  markDirty(); renderCanvas(); renderProps();

/* ===== Arrastrar y soltar ===== */
function bindBuilder() {
  const catalog = $('#catalog'); const canvas = $('#canvas'); const props = $('#props');
  const line = document.createElement('div'); line.className = 'drop-line';
  const removeLine = () => { line.remove(); const fl = $('#flist'); if (fl) fl.classList.remove('is-over'); };
  const dropIndex = (list, y) => {
    const cards = $$('.fcard:not(.is-dragging)', list);
    const n = cards.findIndex((c) => { const r = c.getBoundingClientRect(); return y < r.top + r.height / 2; });
    return n < 0 ? cards.length : n;
  };
  catalog.addEventListener('dragstart', (e) => {
    const it = e.target.closest('.cat-item[draggable="true"]'); if (!it) return;
    builder.drag = it.dataset.type ? { kind: 'type', type: it.dataset.type } : { kind: 'lib', n: Number(it.dataset.n) };
    e.dataTransfer.effectAllowed = 'copy'; e.dataTransfer.setData('text/plain', it.textContent.trim());
  });
  canvas.addEventListener('dragstart', (e) => {
    const c = e.target.closest('.fcard'); if (!c) return;
    builder.drag = { kind: 'move', key: c.dataset.key };
    e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', c.dataset.key);
    requestAnimationFrame(() => c.classList.add('is-dragging'));
  });
  canvas.addEventListener('dragover', (e) => {
    const list = $('#flist');
    if (!builder.drag || !list || !e.target.closest('.paper')) return;
    e.preventDefault();
    list.classList.add('is-over');
    const cards = $$('.fcard:not(.is-dragging)', list); const idx = dropIndex(list, e.clientY);
    if (idx < cards.length) list.insertBefore(line, cards[idx]); else if (cards.length) list.appendChild(line);
  });
  canvas.addEventListener('dragleave', (e) => { if (!canvas.contains(e.relatedTarget)) removeLine(); });
  canvas.addEventListener('drop', (e) => {
    const list = $('#flist'); if (!builder.drag || !list) return;
    e.preventDefault();
    const idx = dropIndex(list, e.clientY); const drag = builder.drag;
    removeLine(); builder.drag = null;
    const d = builderDraft(builder.co);
    if (drag.kind === 'move') {
      const from = d.fields.findIndex((f) => f.key === drag.key); if (from < 0) return;
      const [f] = d.fields.splice(from, 1); d.fields.splice(idx, 0, f);
      if (from !== idx) markDirty();
      builder.selected = { kind: 'custom', key: f.key };
      renderCanvas(); renderProps();
    } else if (drag.kind === 'type') addField({ label: FIELD_TYPES[drag.type].label, type: drag.type }, idx);
    else addField(LIBRARY[drag.n], idx);
  });
  canvas.addEventListener('click', (e) => { const c = e.target.closest('.fcard'); if (c) selectField('custom', c.dataset.key); });
  canvas.addEventListener('keydown', (e) => {
    const c = e.target.closest('.fcard'); if (!c) return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectField('custom', c.dataset.key); refocusCard(c.dataset.key); }
    if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) { e.preventDefault(); moveField(c.dataset.key, e.key === 'ArrowUp' ? -1 : 1, true); }
  });

  /* Propiedades: los cambios se reflejan al instante en la plantilla */
  props.addEventListener('input', (e) => {
    const f = selectedField(); if (!f) return;
    const el = e.target;
    if (el.id === 'p-label') {
      f.label = el.value;
      $('#p-label-field').classList.toggle('is-invalid', !el.value.trim());
      if (f.isNew) { f.key = uniqueKey(slug(el.value), f); builder.selected.key = f.key; $('#p-key').textContent = f.key; }
    } else if (el.id === 'p-help') f.help = el.value;
    else if (el.dataset.opt !== undefined) f.options[Number(el.dataset.opt)] = el.value;
    else if (el.dataset.v && el.type === 'number') {
      f.v = { ...f.v };
      if (el.value === '') delete f.v[el.dataset.v]; else f.v[el.dataset.v] = Number(el.value);
      markDirty();
      return;
    } else return;
    markDirty(); renderCanvas();
  });
  props.addEventListener('change', (e) => {
    const f = selectedField(); if (!f) return;
    if (e.target.id === 'p-type') {
      f.type = e.target.value;
      f.v = {};
      if (hasOptions(f.type) && !f.options.length) f.options = ['Opción 1', 'Opción 2'];
      markDirty(); renderCanvas(); renderProps(); $('#p-type').focus();
    } else if (e.target.id === 'p-req') { f.required = e.target.checked; markDirty(); renderCanvas(); }
    else if (e.target.id === 'p-nofuture') { f.v = { ...f.v }; if (e.target.checked) f.v.noFuture = true; else delete f.v.noFuture; markDirty(); }
  });
  $('#b-head').addEventListener('change', (e) => {
    if (e.target.id !== 'b-company') return;
    builder.co = e.target.value;
    const first = builderDraft(builder.co).fields[0];
    builder.selected = first ? { kind: 'custom', key: first.key } : { kind: 'core', key: 'categoria' };
    renderBHead(); renderCatalog(); renderCanvas(); renderProps();
    $('#b-company').focus();
  });
}

document.addEventListener('dragend', () => {
  builder.drag = null;
  $$('.drop-line').forEach((l) => l.remove());
  $$('.flist.is-over').forEach((l) => l.classList.remove('is-over'));
  $$('.fcard.is-dragging').forEach((c) => c.classList.remove('is-dragging'));
});

Object.assign(ACTIONS, {
  'b-add-type': (el) => addField({ label: FIELD_TYPES[el.dataset.type].label, type: el.dataset.type }),
  'b-add-lib': (el) => addField(LIBRARY[Number(el.dataset.n)]),
  'b-select-core': (el) => selectField('core', el.dataset.key),
  'b-move': (el) => { const f = selectedField(); if (f) moveField(f.key, Number(el.dataset.dir)); },
  'b-opt-add': () => {
    const f = selectedField(); f.options.push(`Opción ${f.options.length + 1}`);
    markDirty(); renderCanvas(); renderProps();
    const inp = $(`#p-opt-${f.options.length - 1}`); inp.focus(); inp.select();
  },
  'b-opt-del': (el) => { const f = selectedField(); f.options.splice(Number(el.dataset.n), 1); markDirty(); renderCanvas(); renderProps(); },
  'b-remove': () => {
    const d = builderDraft(builder.co); const f = selectedField(); if (!f) return;
    const i = d.fields.indexOf(f); d.fields.splice(i, 1);
    const next = d.fields[i] || d.fields[i - 1];
    builder.selected = next ? { kind: 'custom', key: next.key } : { kind: 'custom', key: '' };
    markDirty(); renderCatalog(); renderCanvas(); renderProps();
    toast(`Campo «${esc(f.label)}» quitado de la plantilla`, { ic: 'trash', action: 'Deshacer', onAction: () => { d.fields.splice(i, 0, f); builder.selected = { kind: 'custom', key: f.key }; renderCatalog(); renderCanvas(); renderProps(); } });
  },
  'b-discard': () => {
    delete builder.drafts[builder.co];
    const first = builderDraft(builder.co).fields[0];
    builder.selected = first ? { kind: 'custom', key: first.key } : { kind: 'core', key: 'categoria' };
    renderBHead(); renderCatalog(); renderCanvas(); renderProps();
    toast('Cambios descartados. La plantilla volvió a la versión publicada.', { ic: 'history' });
  },
  'b-publish': () => {
    const co = builder.co; const d = builderDraft(co); const tpl = TEMPLATES[co];
    const noLabel = d.fields.find((f) => !f.label.trim());
    if (noLabel) { selectField('custom', noLabel.key); $('#p-label').focus(); toast('Hay un campo sin etiqueta. Escríbela antes de publicar.', { ic: 'alert' }); return; }
    const noOpts = d.fields.find((f) => hasOptions(f.type) && !f.options.some((o) => o.trim()));
    if (noOpts) { selectField('custom', noOpts.key); toast(`«${esc(noOpts.label)}» necesita al menos una opción.`, { ic: 'alert' }); return; }
    tpl.fields = d.fields.map((f) => F(f.key, f.label.trim(), f.type, f.required, f.help.trim(), hasOptions(f.type) ? f.options.map((o) => o.trim()).filter(Boolean) : [], { ...f.v }));
    tpl.version += 1;
    tpl.publishedAt = new Date(NOW);
    delete builder.drafts[co];
    renderBHead(); renderCatalog(); renderCanvas(); renderProps();
    toast(`Versión ${tpl.version} publicada para ${COMPANIES[co].short}. Los tickets ya creados conservan su versión.`, { action: 'Ver como cliente', ms: 6500, onAction: () => { state.portalCo = co; go('#/portal'); } });
  },
  'b-preview': () => {
    const co = builder.co;
    if (builderDraft(co).dirty) toast('El portal muestra la versión publicada. Publica para que el cliente vea tus cambios.', { ic: 'info', ms: 5000 });
    state.portalCo = co;
    go('#/portal');
  },
  'admin-soon': (el) => toast(`«${el.dataset.name}» no forma parte de este prototipo.`, { ic: 'info' }),
});

    <div class="gate-alert" id="login-alert" role="alert" hidden>${icon('alert')}<span>Correo o contraseña incorrectos. Revísalos o, ${d.wrong}.</span></div>
    <div class="field" id="lg-email-field"><label class="field-label" for="lg-email">Correo</label>
      <input class="gate-input" id="lg-email" type="email" autocomplete="username" inputmode="email" placeholder="nombre@empresa.com" value="${esc(loginPrefill.email)}">
      <span class="field-error">${icon('alert')}<span class="msg">Escribe tu correo.</span></span></div>
    <div class="field" id="lg-pass-field">
      <div class="label-row"><label class="field-label" for="lg-pass">Contraseña</label><button type="button" class="gate-link" data-action="login-forgot">¿Olvidaste tu contraseña?</button></div>
      <div class="pass-wrap"><input class="gate-input" id="lg-pass" type="password" autocomplete="current-password" value="${esc(loginPrefill.pass)}"><button type="button" class="pass-toggle" data-action="login-toggle-pass" aria-label="Mostrar contraseña" aria-pressed="false">${icon('eye')}</button></div>
      <span class="field-error">${icon('alert')}Escribe tu contraseña.</span></div>
    <button type="submit" class="gate-btn" id="lg-submit">Iniciar sesión</button>
    <p class="door-note">${d.note}</p>
  </form>`;
}
function doorHtml(id) {
  const d = DOORS[id];
  const arrow = `<span class="door-arrow" aria-hidden="true">${icon('arrowRight')}</span>`;
  if (loginDoor === id) {
    return `<section class="door door-${id} is-open" aria-labelledby="door-${id}-title">
      <div><h2 class="door-name" id="door-${id}-title">${d.name}</h2><p class="door-who">${d.openWho}</p></div>
      ${doorFormHtml(id)}
    </section>`;
  }
  const aside = !!loginDoor;
  return `<button type="button" class="door door-${id}${aside ? ' is-aside' : ''}" data-action="door-open" data-door="${id}">
    <span><span class="door-name">${d.name}</span><span class="door-who">${aside ? d.asideWho : d.who}</span></span>
    <span class="door-foot"><span class="door-hint">${aside ? 'Cambiar a esta entrada' : d.hint}</span>${arrow}</span>
  </button>`;
}
function gateMainHtml() {
  return `<div><h1 class="gate-title">Inicia sesión en DataTicket</h1>${loginDoor ? '' : '<p class="gate-sub">Elige tu entrada: el personal de Data Global y las empresas cliente entran por puertas distintas.</p>'}</div>
    <div class="doors">${doorHtml('dg')}${doorHtml('cliente')}</div>`;
}
function renderLogin() {
  $('#app').innerHTML = `<div class="gate" id="gate"${loginDoor ? ` data-door="${loginDoor}"` : ''}>
    <header class="gate-top">
      ${BRAND_LOGO ? `<img class="gate-logo" src="${BRAND_LOGO}" alt="Data Global">` : '<span class="gate-logo-slot">Logo de Data Global</span>'}
      <span class="gate-product"><b>DataTicket</b>Mesa de soporte</span>
    </header>
    <main class="gate-main" id="gate-main">${gateMainHtml()}</main>
    <footer class="gate-foot"><span>Data Global S.A.S.</span><span>Las cuentas se crean por invitación.</span></footer>
  </div>`;
  bindLogin();
}
// Cambia de puerta o de vista; la transición de vista hace crecer la puerta elegida
function refreshGate(focusSel, animate) {
  const apply = () => {
    const gate = $('#gate');
    if (!gate) return;
    if (loginDoor) gate.dataset.door = loginDoor; else delete gate.dataset.door;
    $('#gate-main').innerHTML = gateMainHtml();
    bindLogin();
  };
  const done = () => { const f = focusSel && $(focusSel); if (f) f.focus({ preventScroll: true }); };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (animate && document.startViewTransition && !reduce) document.startViewTransition(apply).finished.then(done, done);
  else { apply(); done(); }
}

function bindLogin() {
  const lf = $('#login-form');
  if (lf) {
    lf.addEventListener('input', (e) => {
      const f = e.target.closest('.field');
      if (f) f.classList.remove('is-invalid');
      $('#login-alert').hidden = true;
    });
    lf.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = $('#lg-email').value.trim().toLowerCase(); const pass = $('#lg-pass').value;
      const ef = $('#lg-email-field'); const pf = $('#lg-pass-field');
      const emailMsg = !email ? 'Escribe tu correo.' : !EMAIL_RE.test(email) ? 'Escribe un correo válido, por ejemplo nombre@empresa.com.' : '';
      if (emailMsg) $('.msg', ef).textContent = emailMsg;
      ef.classList.toggle('is-invalid', !!emailMsg);
      pf.classList.toggle('is-invalid', !pass);
      if (emailMsg) { $('#lg-email').focus(); return; }
      if (!pass) { $('#lg-pass').focus(); return; }
      const btn = $('#lg-submit');
      btn.disabled = true;
      btn.textContent = 'Iniciando sesión…';
      loginPrefill = { email, pass: '' };
      setTimeout(() => {
        const acc = ACCOUNTS.find((a) => a.email === email);
        if (!acc || acc.kind !== DOORS[loginDoor].kind) {
          btn.disabled = false;
          btn.textContent = 'Iniciar sesión';
          $('#login-alert').hidden = false;
          $('#lg-pass').value = '';
          $('#lg-pass').focus();
          return;
        }
        login(acc.key);
        const pending = state.afterLogin;
        state.afterLogin = null;
        go(pending && canSee(parseHash(pending), state.session) ? pending : homeFor(state.session));
      }, 450);
    });
  }
  const ff = $('#forgot-form');
  if (ff) {
    ff.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = $('#fg-email').value.trim();
      const ok = EMAIL_RE.test(email);
      $('#fg-field').classList.toggle('is-invalid', !ok);
      if (!ok) { $('#fg-email').focus(); return; }
      loginPrefill = { email, pass: '' };
      loginView = 'sent';
      refreshGate('.door.is-open .gate-btn', false);
    });
  }
}

Object.assign(ACTIONS, {
  'door-open': (el) => {
    loginDoor = el.dataset.door;
    saveDoor(loginDoor);
    loginView = 'login';
    refreshGate('#lg-email', true);
  },
  'login-forgot': () => {
    const em = $('#lg-email');
    loginPrefill = { email: em ? em.value.trim() : '', pass: '' };
    loginView = 'forgot';
    refreshGate('#fg-email', false);
  },
  'login-back': () => { loginView = 'login'; refreshGate('#lg-email', false); },
  'login-toggle-pass': (el) => {
    const inp = $('#lg-pass'); const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    el.setAttribute('aria-pressed', String(show));
    el.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
    el.innerHTML = icon(show ? 'eyeOff' : 'eye');
    inp.focus();
  },
  'user-menu': (el) => {
    const s = state.session;
    if (!s) return;
    const staff = s.kind === 'staff';
    const p = staff ? AGENTS[s.key] : PEOPLE[s.key];
    const detail = staff ? `Rol: ${p.role}. Alcance: ${p.agent ? `${p.scope.length} empresas` : 'global'}` : `Solicitante de ${COMPANIES[p.co].name}`;
    popover(el, `<div class="menu-label">Sesión iniciada</div>
      <div class="menu-item" role="presentation">${avatar(p.ini, staff ? 'avatar-dg' : '')}<span>${p.name}<small>${p.email}</small><small>${detail}</small></span></div>
      <div class="menu-sep"></div>
      <button type="button" class="menu-item" data-logout>${icon('logout')}Cerrar sesión</button>`, {
      align: 'end', width: 310,
      onMount: (pop) => $('[data-logout]', pop).addEventListener('click', () => {
        closePop();
        logout();
        go('#/login');
        toast('Sesión cerrada', { ic: 'logout' });
      }),
    });
  },
});

/* ===== Recorrido del prototipo, rutas, sesión y arranque ===== */
const SCREENS = [
  { id: 'login', key: '1', label: 'Inicio de sesión', who: 'Todos' },
  { id: 'inbox', key: '2', label: 'Bandeja', who: 'Agente' },
  { id: 'detail', key: '3', label: 'Detalle del ticket', who: 'Agente' },
  { id: 'portal', key: '4', label: 'Apertura de ticket', who: 'Cliente' },
  { id: 'builder', key: '5', label: 'Formularios', who: 'Administración' },
];
state.lastTicket = 4817;
state.filtersView = null;
state.session = null;
state.afterLogin = null;
let currentHash = '#/login';

const isDark = () => {
  const th = document.documentElement.dataset.theme;
  return th ? th === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
};

function renderDemoBar() {
  const r = state.route.name;
  let ctx = '';
  if (r === 'login') {
    ctx = `<label for="demo-account">Cuenta de demostración</label><select class="demo-select" id="demo-account">
      <option value="">Elegir cuenta</option>
      <optgroup label="Data Global">${Object.values(AGENTS).map((a) => `<option value="${a.email}">${a.name}: ${a.agent ? `agente, ${a.scope.length} empresas` : 'administrador'}</option>`).join('')}</optgroup>
      <optgroup label="Empresas cliente">${Object.values(PEOPLE).map((p) => `<option value="${p.email}">${p.name}: ${COMPANIES[p.co].short}</option>`).join('')}</optgroup>
    </select>`;
  } else if (r === 'portal') {
    ctx = `<label for="demo-co">Empresa del cliente</label><select class="demo-select" id="demo-co">${Object.values(COMPANIES).map((c) => `<option value="${c.id}"${c.id === state.portalCo ? ' selected' : ''}>${c.short}</option>`).join('')}</select>`;
    const tk = lastPortalTicket;
    if (tk) {
      ctx += inScope(tk)
        ? `<button type="button" class="demo-btn" data-action="demo-see-ticket">${icon('inbox')}Ver ${fmtId(tk.id)} en la bandeja de ${AGENTS[ME].name}</button>`
        : `<span class="demo-hint">${fmtId(tk.id)} no llega a la bandeja de ${AGENTS[ME].name}: ${COMPANIES[tk.co].short} no está en su alcance</span>`;
    }
  }
  const sess = state.session && r !== 'login' ? `<span class="demo-hint">Sesión: ${sessionName()}</span>` : '';
  $('#demo-bar').innerHTML = `<div class="demo-name">DataTicket<span>Prototipo navegable</span></div>
    <div class="demo-tabs" role="group" aria-label="Pantallas del prototipo">${SCREENS.map((s) => `<button type="button" class="demo-tab" data-action="demo-go" data-screen="${s.id}"${s.id === r ? ' aria-current="page"' : ''}><kbd>${s.key}</kbd>${s.label}<em>${s.who}</em></button>`).join('')}</div>
    <div class="demo-right">${ctx}${sess}
      <button type="button" class="demo-btn" data-action="theme">${icon(isDark() ? 'sun' : 'moon')}${isDark() ? 'Tema claro' : 'Tema oscuro'}</button>
      <button type="button" class="demo-btn" data-action="demo-hide">${icon('eyeOff')}Ocultar barra</button>
    </div>`;
}

function parseHash(h) {
  const [a, b] = h.replace(/^#\/?/, '').split('/');
  if (a === 'ticket' && b) return { name: 'detail', id: Number(b) };
  if (a === 'portal') return { name: 'portal' };
  if (a === 'admin') return { name: 'builder' };
  if (a === 'bandeja') return { name: 'inbox', viewId: b };
  return { name: 'login' };
}
function setHash(h) {
  currentHash = h;
  try { history.replaceState(null, '', h); } catch (err) { /* sin historial disponible */ }
}
function route() {
  closePop(); closeOverlay();
  let r = parseHash(currentHash);
  if (r.name !== 'login' && !state.session) {
    // Sin sesión: primero el inicio de sesión; después se vuelve a la pantalla pedida si el rol la permite
    state.afterLogin = currentHash;
    setHash('#/login');
    r = { name: 'login' };
  } else if (!canSee(r, state.session)) {
    toast('Tu rol no tiene acceso a esa pantalla.', { ic: 'lock' });
    setHash(homeFor(state.session));
    r = parseHash(currentHash);
  }
  state.route = r;
  if (r.name === 'login') renderLogin();
  else if (r.name === 'inbox') {
    const target = r.viewId && state.views.some((v) => v.id === r.viewId) ? r.viewId : state.viewId;
    state.viewId = target;
    // Volver desde el detalle conserva los criterios; cambiar de vista aplica los de la vista
    if (state.filtersView !== target) { applyView(currentView()); state.filtersView = target; }
    renderInbox();
  } else if (r.name === 'detail') {
    state.lastTicket = r.id;
    renderDetail(r.id);
  } else if (r.name === 'portal') renderPortal();
  else renderBuilder();
  renderDemoBar();
  if (r.name === 'login') {
    const f = $('#lg-email') || $('#gate .door');
    if (f) f.focus({ preventScroll: true });
  } else {
    const h = $('#app h1');
    if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  }
}
function go(hash) {
  currentHash = hash;
  let native = false;
  try {
    if (location.hash !== hash) { location.hash = hash; native = location.hash === hash; }
  } catch (err) { native = false; }
  if (!native) route();
}
// Las pestañas del recorrido entran con el perfil de cada pantalla si la sesión actual no sirve
function goScreen(id) {
  closeNav();
  const s = state.session;
  // La pestaña del recorrido vuelve al punto de partida: las dos puertas cerradas
  if (id === 'login') { logout(); loginDoor = null; saveDoor(null); go('#/login'); return; }
  if ((id === 'inbox' || id === 'detail') && (!s || s.kind !== 'staff')) login('laura');
  if (id === 'builder' && (!s || s.kind !== 'staff' || AGENTS[s.key].agent)) login(ADMIN);
  if (id === 'portal' && (!s || s.kind !== 'client')) login(PORTAL_USER[state.portalCo]);
  if (id === 'inbox') go(`#/bandeja/${state.viewId}`);
  else if (id === 'detail') go(`#/ticket/${state.lastTicket}`);
  else if (id === 'portal') go('#/portal');
  else go('#/admin/formularios');
}
window.addEventListener('hashchange', () => {
  currentHash = location.hash.startsWith('#/') ? location.hash : '#/login';
  route();
});

Object.assign(ACTIONS, {
  'demo-go': (el) => goScreen(el.dataset.screen),
  'demo-hide': () => { $('.root').classList.add('demo-hidden'); $('.demo-reveal').focus(); },
  'demo-show': () => { $('.root').classList.remove('demo-hidden'); const tab = $('.demo-tab[aria-current="page"]'); if (tab) tab.focus(); },
  'demo-see-ticket': () => {
    login(AGENTS[ME] ? ME : 'laura');
    state.viewId = 'sin_asignar';
    state.filtersView = 'sin_asignar';
    applyView(currentView());
    lastPortalTicket.fresh = true;
    go('#/bandeja/sin_asignar');
  },
  theme: () => { document.documentElement.dataset.theme = isDark() ? 'light' : 'dark'; renderDemoBar(); $('[data-action="theme"]').focus(); },
});

/* ===== Eventos globales ===== */
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-action]');
  if (a && !a.disabled && ACTIONS[a.dataset.action]) { ACTIONS[a.dataset.action](a, e); return; }
  const link = e.target.closest('a[href^="#/"]');
  if (link && e.button === 0 && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
    e.preventDefault();
    const href = link.getAttribute('href');
    closeNav();
    if (link.classList.contains('nav-item') && href === currentHash && state.route.name === 'inbox') {
      // Clic sobre la vista activa: vuelve a sus criterios, columnas y orden originales
      applyView(currentView());
      state.search = ''; const q = $('#q'); if (q) q.value = '';
      updateInbox();
      return;
    }
    go(href);
    return;
  }
  const row = e.target.closest('.tickets tbody tr[data-id]');
  if (row && !e.target.closest('a, button')) go(`#/ticket/${row.dataset.id}`);
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') {
    state.search = e.target.value;
    if (state.route.name === 'inbox') { renderInboxHead(); renderTable(); }
  } else if (e.target.id === 'reply-text' && state.route.name === 'detail') {
    DRAFTS[state.route.id] = e.target.value;
  }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'demo-account' && e.target.value) {
    const acc = ACCOUNTS.find((a) => a.email === e.target.value);
    loginDoor = acc.kind === 'staff' ? 'dg' : 'cliente';
    saveDoor(loginDoor);
    loginView = 'login';
    loginPrefill = { email: acc.email, pass: DEMO_PASSWORD };
    refreshGate('#lg-submit', true);
  } else if (e.target.id === 'demo-co') {
    login(PORTAL_USER[e.target.value]);
    renderPortal(); renderDemoBar();
    $('#demo-co').focus();
  } else if (e.target.id === 'reply-file') {
    const tk = currentTicket();
    DRAFTS[tk.id] = $('#reply-text').value;
    pendingFiles[tk.id] = (pendingFiles[tk.id] || []).concat(Array.from(e.target.files).map((f) => [f.name, fmtSize(f.size)]));
    $('#composer-wrap').innerHTML = composerHtml(tk);
  }
});
document.addEventListener('keydown', (e) => {
  if (e.target.id === 'q' && e.key === 'Enter' && state.route.name !== 'inbox') {
    state.search = e.target.value;
    go(`#/bandeja/${state.viewId}`);
    return;
  }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  if (typing || e.ctrlKey || e.metaKey || e.altKey || document.querySelector('.modal-backdrop, .drawer')) return;
  if (e.key === '/' && $('#q')) { e.preventDefault(); $('#q').focus(); return; }
  const s = SCREENS.find((x) => x.key === e.key);
  if (s) goScreen(s.id);
});

/* ===== Arranque ===== */
// Cada ticket conserva la versión de plantilla con la que se capturó (8.4).
// Los campos personalizados se guardan por clave, como en JSONB, no por posición
TICKETS.forEach((tk) => {
  const tpl = TEMPLATES[tk.co]; const old = TEMPLATE_HISTORY[tk.co];
  const src = old && tk.created < tpl.publishedAt ? old : tpl;
  tk.form = { name: tpl.name, version: src.version, fields: src.fields.map((f) => ({ key: f.key, label: f.label, type: f.type })) };
  if (Array.isArray(tk.cf)) tk.cf = Object.fromEntries(src.fields.map((f, n) => [f.key, tk.cf[n] || '']));
});
if (location.hash.startsWith('#/')) currentHash = location.hash;
route();
</script>
